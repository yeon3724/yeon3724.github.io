name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check page structure and navigation
        run: |
          python3 -m venv "$RUNNER_TEMP/portfolio-check"
          "$RUNNER_TEMP/portfolio-check/bin/pip" install --disable-pip-version-check Pillow==12.2.0 playwright==1.60.0 pypdf==6.13.2
          "$RUNNER_TEMP/portfolio-check/bin/python" tests/validate.py
          "$RUNNER_TEMP/portfolio-check/bin/python" tests/browser.py
